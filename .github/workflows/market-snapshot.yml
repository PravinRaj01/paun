name: market-snapshot

# Builds market-snapshot.json daily and publishes it to the `data` branch (never `main`: a push to `main`
# triggers a site rebuild, and daily bot commits would clutter the history). The app fetches it from raw.githubusercontent.com.
on:
  schedule:
    - cron: "30 22 * * 1-5" # after the US close, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Build snapshot
        working-directory: ml
        # built OUTSIDE the repo folder so it can never collide with the tracked copy on the data branch
        run: python -m paun_ml.snapshot --models-dir ../public/models --out "$RUNNER_TEMP/market-snapshot.json"
      - name: Publish to data branch
        run: bash .github/scripts/publish-snapshot.sh "$RUNNER_TEMP/market-snapshot.json"
