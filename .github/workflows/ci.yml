name: ci

# Runs on every pull request and on every push to main, so a broken change is caught before (or right after) it
# reaches the live site. Cloudflare redeploys on each push to main; this check does not block that by itself, so
# merge only green PRs (or turn on branch protection with these checks as required).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install (lockfile must be in sync with package.json)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests (forecast parity, money maths, Vault import)
        run: bun run test
      - name: Production build
        run: bun run build

  ml:
    name: ml (offline tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (synthetic data, no network)
        run: python -m pytest -q
